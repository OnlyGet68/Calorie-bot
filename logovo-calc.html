  <script>
    // 1. Блокировка правой кнопки
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });

    // 2. Блокировка клавиш разработчика
    document.addEventListener('keydown', e => {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
    });

    // 3. Защита от выделения и копирования
    document.addEventListener('selectstart', e => { e.preventDefault(); return false; });
    document.addEventListener('copy', e => { e.preventDefault(); return false; });
    document.addEventListener('dragstart', e => { e.preventDefault(); return false; });

    // 4. Обнаружение открытых DevTools
    function detectDevTools() {
      const threshold = 160;
      const widthDiff = window.outerWidth - window.innerWidth;
      const heightDiff = window.outerHeight - window.innerHeight;
      if (widthDiff > threshold || heightDiff > threshold) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#151312;color:#c2542a;font-family:sans-serif;font-size:24px;text-align:center;padding:20px;">🔒 Доступ ограничен<br><span style="font-size:16px;color:#9a9188;">Закройте инструменты разработчика</span></div>';
      }
    }
    setInterval(detectDevTools, 2000);

    // 5. Защита от iframe
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
  </script>

      { name: "Котлета мясная", kcal: 220, protein: 15, fat: 16, carbs: 6, typicalGrams: 100 },
      { name: "Котлета куриная", kcal: 180, protein: 17, fat: 10, carbs: 5, typicalGrams: 100 },
      { name: "Рыба жареная", kcal: 210, protein: 20, fat: 14, carbs: 4, typicalGrams: 150 },
      { name: "Гуляш", kcal: 170, protein: 14, fat: 10, carbs: 6, typicalGrams: 250 },
      { name: "Рагу овощное", kcal: 65, protein: 2, fat: 3, carbs: 8, typicalGrams: 250 },
      { name: "Солянка", kcal: 90, protein: 6, fat: 6, carbs: 3, typicalGrams: 300 },
      { name: "Щи", kcal: 40, protein: 2, fat: 2, carbs: 4, typicalGrams: 300 },
      { name: "Суп куриный", kcal: 45, protein: 4, fat: 2, carbs: 4, typicalGrams: 300 },
      { name: "Вареники с картошкой", kcal: 180, protein: 5, fat: 4, carbs: 30, typicalGrams: 200 },
      { name: "Пирожок с мясом", kcal: 260, protein: 8, fat: 12, carbs: 30, typicalGrams: 100 },

      { name: "Шашлык куриный", kcal: 190, protein: 22, fat: 11, carbs: 0, typicalGrams: 200 },
      { name: "Чай без сахара", kcal: 1, protein: 0, fat: 0, carbs: 0.3, typicalGrams: 250 },
      { name: "Кофе чёрный без сахара", kcal: 2, protein: 0.1, fat: 0, carbs: 0, typicalGrams: 200 },
      { name: "Смузи фруктовый", kcal: 65, protein: 0.8, fat: 0.3, carbs: 15, typicalGrams: 250 },
      { name: "Компот", kcal: 60, protein: 0.2, fat: 0, carbs: 15, typicalGrams: 250 },
      { name: "Морс", kcal: 45, protein: 0.1, fat: 0, carbs: 11, typicalGrams: 250 },
      { name: "Энергетик", kcal: 45, protein: 0, fat: 0, carbs: 11, typicalGrams: 250 },
      { name: "Вино красное сухое", kcal: 68, protein: 0.2, fat: 0, carbs: 0.3, typicalGrams: 150 },
      { name: "Вино белое сухое", kcal: 66, protein: 0.1, fat: 0, carbs: 0.6, typicalGrams: 150 },
      { name: "Горчица", kcal: 143, protein: 5.7, fat: 8.4, carbs: 12 },
      { name: "Сметанный соус", kcal: 210, protein: 2, fat: 20, carbs: 5 },
      { name: "Ткемали", kcal: 40, protein: 0.6, fat: 0.1, carbs: 9 },
      { name: "Терияки соус", kcal: 89, protein: 5.9, fat: 0, carbs: 16 },
      { name: "Пастила", kcal: 310, protein: 0.5, fat: 0.1, carbs: 80, typicalGrams: 40 },
      { name: "Зефир", kcal: 304, protein: 0.8, fat: 0.2, carbs: 79, typicalGrams: 40 },
      { name: "Вафли", kcal: 425, protein: 3.2, fat: 21, carbs: 55, typicalGrams: 50 },
      { name: "Пряники", kcal: 350, protein: 4.8, fat: 2.8, carbs: 77, typicalGrams: 50 },
      { name: "Сухарики", kcal: 470, protein: 9, fat: 20, carbs: 60, typicalGrams: 50 },
      { name: "Крекеры", kcal: 430, protein: 9, fat: 12, carbs: 70, typicalGrams: 50 },
      { name: "Батончик злаковый", kcal: 380, protein: 6, fat: 10, carbs: 65, typicalGrams: 40 },
      { name: "Сухое печенье (Мария)", kcal: 400, protein: 8, fat: 9, carbs: 74, typicalGrams: 50 },
      { name: "Протеин сывороточный (порошок)", kcal: 380, protein: 75, fat: 5, carbs: 8, typicalGrams: 30 },
      { name: "Протеин изолят (порошок)", kcal: 370, protein: 85, fat: 1.5, carbs: 3, typicalGrams: 30 },
      { name: "Казеин (порошок)", kcal: 360, protein: 75, fat: 2, carbs: 6, typicalGrams: 30 },
      { name: "Протеиновый батончик", kcal: 380, protein: 30, fat: 12, carbs: 35, typicalGrams: 50 },
      { name: "Гейнер (порошок)", kcal: 380, protein: 20, fat: 3, carbs: 70, typicalGrams: 100 },
      { name: "BCAA (порошок)", kcal: 6, protein: 1.5, fat: 0, carbs: 0, typicalGrams: 10 },
      { name: "Креатин моногидрат", kcal: 0, protein: 0, fat: 0, carbs: 0, typicalGrams: 5 },
    ];

    const uid = () => Math.random().toString(36).slice(2, 10);
    const dateStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };
    const foodKeyToday = () => `foodlog:${dateStr()}`;
    const waterKeyToday = () => `waterlog:${dateStr()}`;

    // ============================================================
    // ГЛАВНЫЙ КОМПОНЕНТ
    // ============================================================
    function CalorieCalc() {
      const [sex, setSex] = useState("male");
      const [age, setAge] = useState(28);
      const [weight, setWeight] = useState(80);
      const [height, setHeight] = useState(178);
      const [activity, setActivity] = useState("light");
      const [goal, setGoal] = useState("lose");

      const [log, setLog] = useState([]);
      const [logLoaded, setLogLoaded] = useState(false);
      const [foodName, setFoodName] = useState("");
      const [foodKcal, setFoodKcal] = useState("");
      const [foodProtein, setFoodProtein] = useState("");
      const [foodFat, setFoodFat] = useState("");
      const [foodCarbs, setFoodCarbs] = useState("");
      const [selectedFood, setSelectedFood] = useState(null);
      const [grams, setGrams] = useState(100);
      const [showSuggestions, setShowSuggestions] = useState(false);

      const [water, setWater] = useState([]);
      const [waterLoaded, setWaterLoaded] = useState(false);
      const [customMl, setCustomMl] = useState("");

      const foodKey = foodKeyToday();
      const waterKey = waterKeyToday();

      useEffect(() => {
        (async () => {
          try {
            const r = await window.storage.get(foodKey, false);
            setLog(r ? JSON.parse(r.value) : []);
          } catch { setLog([]); }
          setLogLoaded(true);
          try {
            const r2 = await window.storage.get(waterKey, false);
            setWater(r2 ? JSON.parse(r2.value) : []);
          } catch { setWater([]); }
          setWaterLoaded(true);
        })();
      }, []);

      const persistLog = useCallback(async (next) => {
        try { await window.storage.set(foodKey, JSON.stringify(next), false); } catch {}
      }, [foodKey]);

      const persistWater = useCallback(async (next) => {
        try { await window.storage.set(waterKey, JSON.stringify(next), false); } catch {}
      }, [waterKey]);

      const suggestions = useMemo(() => {
        const q = foodName.trim().toLowerCase();
        if (!q || selectedFood) return [];
        return FOOD_DB.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 6);
      }, [foodName, selectedFood]);

      const computedFromDb = useMemo(() => {
        if (!selectedFood) return null;
        const g = Number(grams) || 0;
        const ratio = g / 100;
        return {
          kcal: Math.round(selectedFood.kcal * ratio),
          protein: Math.round(selectedFood.protein * ratio * 10) / 10,
          fat: Math.round(selectedFood.fat * ratio * 10) / 10,
          carbs: Math.round(selectedFood.carbs * ratio * 10) / 10,
        };
      }, [selectedFood, grams]);

      function pickFromRecommendation(name) {
        const dbFood = FOOD_DB.find((f) => f.name === name);
        if (dbFood) {
          pickSuggestion(dbFood);
        } else {
          setFoodName(name);
          setSelectedFood(null);
        }
      }

      function pickSuggestion(food) {
        setSelectedFood(food);
        setFoodName(food.name);
        setGrams(food.typicalGrams || 100);
        setShowSuggestions(false);
      }

      function onFoodNameChange(v) {
        setFoodName(v);
        setShowSuggestions(true);
        if (selectedFood && v !== selectedFood.name) setSelectedFood(null);
      }

      function addFood() {
        const name = foodName.trim();
        if (!name) return;
        let entry;
        if (selectedFood && computedFromDb) {
          if (!computedFromDb.kcal) return;
          entry = { id: uid(), name: `${name} (${grams} г)`, ...computedFromDb };
        } else {
          const kcal = Number(foodKcal);
          if (!kcal) return;
          entry = {
            id: uid(),
            name,
            kcal,
            protein: Number(foodProtein) || 0,
            fat: Number(foodFat) || 0,
            carbs: Number(foodCarbs) || 0,
          };
        }
        const next = [...log, entry];
        setLog(next);
        persistLog(next);
        setFoodName("");
        setFoodKcal("");
        setFoodProtein("");
        setFoodFat("");
        setFoodCarbs("");
        setSelectedFood(null);
        setGrams(100);
      }

      function removeFood(id) {
        const next = log.filter((f) => f.id !== id);
        setLog(next);
        persistLog(next);
      }

      function addWater(ml) {
        if (!ml) return;
        const next = [...water, { id: uid(), ml }];
        setWater(next);
        persistWater(next);
      }

      function addCustomWater() {
        const ml = Number(customMl);
        if (!ml) return;
        addWater(ml);
        setCustomMl("");
      }

      function removeWater(id) {
        const next = water.filter((w) => w.id !== id);
        setWater(next);
        persistWater(next);
      }

      const result = useMemo(() => {
        const a = Number(age) || 0;
        const w = Number(weight) || 0;
        const h = Number(height) || 0;
        const bmr = sex === "male" ? 10 * w + 6.25 * h - 5 * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
        const mult = ACTIVITY.find((x) => x.key === activity)?.mult ?? 1.2;
        const tdee = bmr * mult;
        const g = GOALS.find((x) => x.key === goal);
        const target = tdee * (1 + g.delta);
        const protein = w * (goal === "dry" ? 2.3 : goal === "lose" ? 2.0 : goal === "gain" ? 1.8 : 1.6);
        const fat = (target * 0.27) / 9;
        const carbs = (target - protein * 4 - fat * 9) / 4;
        const activityIdx = ACTIVITY.findIndex((x) => x.key === activity);
        const waterTarget = w * 33 + Math.max(0, activityIdx - 1) * 350;
        return { bmr, tdee, target, protein, fat, carbs: Math.max(carbs, 0), waterTarget };
      }, [sex, age, weight, height, activity, goal]);

      const eaten = log.reduce((sum, f) => sum + f.kcal, 0);
      const eatenProtein = log.reduce((sum, f) => sum + (f.protein || 0), 0);
      const eatenFat = log.reduce((sum, f) => sum + (f.fat || 0), 0);
      const eatenCarbs = log.reduce((sum, f) => sum + (f.carbs || 0), 0);

      const remaining = Math.round(result.target - eaten);
      const over = remaining < 0;
      const ringPct = Math.min(100, (eaten / (result.target || 1)) * 100);

      const drunk = water.reduce((sum, w) => sum + w.ml, 0);
      const waterRemaining = Math.max(0, Math.round(result.waterTarget - drunk));
      const waterPct = Math.min(100, (drunk / (result.waterTarget || 1)) * 100);
      const waterDone = drunk >= result.waterTarget;

      const styles = {
        app: { background: "#151312", color: "#e9e2d6", padding: 14, borderRadius: 12, border: "1px solid #322d29", maxWidth: 640, width: "calc(100% - 16px)", margin: "0 auto" },
        header: { display: "flex", alignItems: "center", gap: 9, marginBottom: 16 },
        brand: { fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: 0.5 },
        sub: { fontSize: 11, color: "#9a9188" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 },
        card: { background: "#1c1a18", border: "1px solid #322d29", borderRadius: 10, padding: 14 },
        rowLabel: { fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "#9a9188", margin: "10px 0 6px" },
        segRow: { display: "flex", gap: 6 },
        seg: { flex: 1, background: "#211e1b", border: "1px solid transparent", color: "#9a9188", borderRadius: 7, padding: "7px 6px", fontSize: 11.5, cursor: "pointer" },
        segActive: { background: "#c2542a", color: "#1c1a18", fontWeight: 700 },
        fieldsRow: { display: "flex", gap: 8, margin: "12px 0 2px" },
        field: { flex: 1, display: "flex", flexDirection: "column", gap: 4 },
        fieldLabel: { fontSize: 10.5, color: "#9a9188" },
        fieldInputWrap: { display: "flex", alignItems: "center", background: "#211e1b", border: "1px solid #322d29", borderRadius: 7, padding: "6px 8px" },
        fieldInput: { background: "transparent", border: "none", color: "#3fb7a6", width: "100%", fontSize: 14, fontWeight: 600 },
        fieldUnit: { fontSize: 10, color: "#9a9188" },
        optRow: { display: "flex", alignItems: "center", gap: 8, background: "#211e1b", border: "1px solid transparent", borderRadius: 7, padding: "7px 9px", cursor: "pointer" },
        optRowActive: { borderColor: "#c2542a", background: "#241d18" },
        optDot: (active) => ({ width: 8, height: 8, borderRadius: "50%", background: active ? "#c2542a" : "#322d29" }),
        optLabel: { fontSize: 12, fontWeight: 600 },
        optHint: { fontSize: 10, color: "#9a9188" },
        ringsRow: { display: "flex", justifyContent: "center", gap: 10, padding: "4px 0 10px" },
        ringCol: { display: "flex", flexDirection: "column", alignItems: "center", gap: 4 },
        ringNumber: { fontFamily: "'Oswald', sans-serif", fontSize: 21, fontWeight: 700, fill: "#e9e2d6" },
        ringUnit: { fontSize: 8.5, fill: "#9a9188" },
        ringCaption: { fontSize: 10, fontWeight: 700 },
        statRow: { display: "flex", gap: 8, marginBottom: 14 },
        statBox: { flex: 1, background: "#211e1b", border: "1px solid #322d29", borderRadius: 8, padding: "8px 10px", textAlign: "center" },
        statValue: { fontFamily: "'Oswald', sans-serif", fontSize: 16, fontWeight: 700, color: "#3fb7a6" },
        statLabel: { fontSize: 9.5, color: "#9a9188" },
        macroTitle: { fontSize: 10.5, textTransform: "uppercase", letterSpacing: 0.5, color: "#9a9188", marginBottom: 6 },
        macroRow: { display: "flex", gap: 8 },
        macroBox: { flex: 1, display: "flex", flexDirection: "column", gap: 4 },
        macroBarTrack: { height: 5, borderRadius: 3, background: "#211e1b", overflow: "hidden" },
        macroBarFill: { height: "100%", borderRadius: 3, transition: "width 0.4s ease" },
        macroValue: { fontSize: 12.5, fontWeight: 700 },
        macroLabel: { fontSize: 10, color: "#9a9188" },
        foodNameInput: { width: "100%", background: "#211e1b", border: "1px solid #322d29", color: "#e9e2d6", borderRadius: 7, padding: "8px 10px", fontSize: 12.5, marginBottom: 6 },
        foodKcalInput: { width: 80, background: "#211e1b", border: "1px solid #322d29", color: "#3fb7a6", borderRadius: 7, padding: "8px 10px", fontSize: 12.5, textAlign: "center" },
        addFoodBtn: { width: 36, flexShrink: 0, background: "#c2542a", border: "none", borderRadius: 7, color: "#1c1a18", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" },
        macroInputRow: { display: "flex", gap: 6, marginBottom: 10, alignItems: "flex-end", flexWrap: "wrap" },
        miniField: { flex: 1, minWidth: 52, display: "flex", flexDirection: "column", gap: 3 },
        miniFieldInput: { background: "#211e1b", border: "1px solid #322d29", borderRadius: 7, padding: "7px 6px", fontSize: 12.5, textAlign: "center", fontWeight: 600, width: "100%" },
        miniFieldLabel: { fontSize: 8.5, color: "#9a9188", textAlign: "center" },
        foodList: { display: "flex", flexDirection: "column", gap: 5 },
        foodRow: { display: "flex", alignItems: "center", gap: 8, background: "#211e1b", border: "1px solid #322d29", borderRadius: 7, padding: "6px 10px", fontSize: 12 },
        foodKcalTag: { color: "#3fb7a6", fontWeight: 600, textAlign: "right", flexShrink: 0 },
        macroTag: { color: "#9a9188", fontWeight: 400, fontSize: 10 },
        ghostDelete: { background: "transparent", border: "none", color: "#9a9188", cursor: "pointer" },
        waterQuickRow: { display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" },
        waterQuickBtn: { background: "#211e1b", border: "1px solid #322d29", color: "#3fb7a6", borderRadius: 7, padding: "6px 10px", fontSize: 11.5, cursor: "pointer", fontWeight: 600 },
        footnote: { fontSize: 10, color: "#9a9188", lineHeight: 1.5, marginTop: 10 },
        foodInputRow: { display: "flex", gap: 6, marginBottom: 10 },
        dbRow: { display: "flex", gap: 8, alignItems: "flex-end", marginBottom: 4 },
        dbPreview: { flex: 1, fontSize: 12, paddingBottom: 6 },
        suggestBox: { position: "absolute", top: "100%", left: 0, right: 0, zIndex: 5, marginTop: 2, background: "#211e1b", border: "1px solid #322d29", borderRadius: 8, overflow: "hidden", boxShadow: "0 6px 16px rgba(0,0,0,0.4)" },
        suggestItem: { display: "flex", justifyContent: "space-between", width: "100%", background: "transparent", border: "none", borderBottom: "1px solid #322d29", color: "#e9e2d6", padding: "8px 10px", fontSize: 12, cursor: "pointer", textAlign: "left" },
        suggestMeta: { fontSize: 10.5, color: "#9a9188" },
        recoChips: { display: "flex", flexWrap: "wrap", gap: 6 },
        recoChip: { background: "#211e1b", border: "1px solid #322d29", color: "#e9e2d6", borderRadius: 999, padding: "6px 12px", fontSize: 11.5, cursor: "pointer" },
      };

      return (
        <div style={styles.app}>
          <div style={styles.header}>
            <div style={{ width: 30, height: 30, borderRadius: 7, background: "#c2542a", color: "#1c1a18", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Flame />
            </div>
            <div>
              <div style={styles.brand}>ЛОГОВО ЖИЗНИ</div>
              <div style={styles.sub}>норма калорий · еда · вода за день</div>
            </div>
          </div>

          <div style={styles.grid}>
            <div style={styles.card}>
              <div style={styles.rowLabel}>Пол</div>
              <div style={styles.segRow}>
                <button style={{ ...styles.seg, ...(sex === "male" ? styles.segActive : {}) }} onClick={() => setSex("male")}>Мужской</button>
                <button style={{ ...styles.seg, ...(sex === "female" ? styles.segActive : {}) }} onClick={() => setSex("female")}>Женский</button>
              </div>

              <div style={styles.fieldsRow}>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Возраст</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={age} onChange={e => setAge(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>лет</span>
                  </div>
                </div>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Вес</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={weight} onChange={e => setWeight(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>кг</span>
                  </div>
                </div>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Рост</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={height} onChange={e => setHeight(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>см</span>
                  </div>
                </div>
              </div>

              <div style={styles.rowLabel}>Активность</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                {ACTIVITY.map(a => (
                  <button key={a.key} onClick={() => setActivity(a.key)} style={{ ...styles.optRow, ...(activity === a.key ? styles.optRowActive : {}) }}>
                    <span style={styles.optDot(activity === a.key)} />
                    <span style={{ flex: 1, textAlign: "left" }}>
                      <div style={styles.optLabel}>{a.label}</div>
                      <div style={styles.optHint}>{a.hint}</div>
                    </span>
                  </button>
                ))}
              </div>

              <div style={styles.rowLabel}>Цель</div>
              <div style={styles.segRow}>
                {GOALS.map(g => (
                  <button key={g.key} style={{ ...styles.seg, ...(goal === g.key ? styles.segActive : {}) }} onClick={() => setGoal(g.key)}>
                    {g.label}
                  </button>
                ))}
              </div>
            </div>

            <div style={styles.card}>
              <div style={styles.ringsRow}>
                <div style={styles.ringCol}>
                  <svg viewBox="0 0 140 140" style={{ width: 128, height: 128 }}>
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#2a2521" strokeWidth="11" />
                    <circle cx="70" cy="70" r="58" fill="none" stroke={over ? "#d9503f" : "#c2542a"} strokeWidth="11" strokeLinecap="round" strokeDasharray={2 * Math.PI * 58} strokeDashoffset={2 * Math.PI * 58 * (1 - ringPct / 100)} transform="rotate(-90 70 70)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
                    <text x="70" y="66" textAnchor="middle" style={styles.ringNumber}>{Math.round(eaten)}</text>
                    <text x="70" y="84" textAnchor="middle" style={styles.ringUnit}>ккал съедено</text>
                  </svg>
                  <div style={{ ...styles.ringCaption, color: over ? "#d9503f" : "#c2542a" }}>
                    {over ? `перебор на ${Math.abs(remaining)}` : `осталось ${remaining} ккал`}
                  </div>
                </div>

                <div style={styles.ringCol}>
                  <svg viewBox="0 0 140 140" style={{ width: 128, height: 128 }}>
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#2a2521" strokeWidth="11" />
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#3fb7a6" strokeWidth="11" strokeLinecap="round" strokeDasharray={2 * Math.PI * 58} strokeDashoffset={2 * Math.PI * 58 * (1 - waterPct / 100)} transform="rotate(-90 70 70)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
                    <text x="70" y="66" textAnchor="middle" style={{ ...styles.ringNumber, fill: "#3fb7a6" }}>{(drunk / 1000).toFixed(1)}л</text>
                    <text x="70" y="84" textAnchor="middle" style={styles.ringUnit}>воды выпито</text>
                  </svg>
                  <div style={{ ...styles.ringCaption, color: "#3fb7a6" }}>
                    {waterDone ? "норма выполнена 💧" : `осталось ${waterRemaining} мл`}
                  </div>
                </div>
              </div>

              <div style={styles.statRow}>
                <div style={styles.statBox}>
                  <div style={styles.statValue}>{Math.round(result.target)}</div>
                  <div style={styles.statLabel}>Норма калорий</div>
                </div>
                <div style={styles.statBox}>
                  <div style={styles.statValue}>{(result.waterTarget / 1000).toFixed(1)} л</div>
                  <div style={styles.statLabel}>Норма воды</div>
                </div>
              </div>

              <div style={styles.macroTitle}>БЖУ — съедено / норма на день</div>
              <div style={styles.macroRow}>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenProtein / result.protein) * 100)}%`, background: "#3fb7a6" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenProtein)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.protein)} г</span></div>
                  <div style={styles.macroLabel}>Белки</div>
                </div>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenFat / result.fat) * 100)}%`, background: "#c2542a" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenFat)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.fat)} г</span></div>
                  <div style={styles.macroLabel}>Жиры</div>
                </div>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenCarbs / result.carbs) * 100)}%`, background: "#9a9188" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenCarbs)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.carbs)} г</span></div>
                  <div style={styles.macroLabel}>Углеводы</div>
                </div>
              </div>
            </div>
          </div>

          <div style={{ ...styles.card, marginTop: 12 }}>
            <div style={styles.rowLabel}>{RECOMMENDATIONS[goal].title}</div>
            <p style={{ ...styles.footnote, marginTop: 0, marginBottom: 10 }}>{RECOMMENDATIONS[goal].note}</p>
            <div style={styles.recoChips}>
              {RECOMMENDATIONS[goal].items.map((item) => (
                <button key={item} style={styles.recoChip} onClick={() => pickFromRecommendation(item)}>
                  + {item}
                </button>
              ))}
            </div>
          </div>

          <div style={{ ...styles.card, marginTop: 12 }}>
            <div style={styles.rowLabel}>Дневник питания — сегодня</div>
            <div style={{ position: "relative" }}>
              <input style={styles.foodNameInput} placeholder="начни вводить продукт (например, куриная)" value={foodName} onChange={e => { setFoodName(e.target.value); setShowSuggestions(true); if (selectedFood) setSelectedFood(null); }} onFocus={() => setShowSuggestions(true)} onBlur={() => setTimeout(() => setShowSuggestions(false), 120)} onKeyDown={e => e.key === "Enter" && addFood()} />
              {showSuggestions && suggestions.length > 0 && (
                <div style={styles.suggestBox}>
                  {suggestions.map(f => (
                    <button key={f.name} style={styles.suggestItem} onMouseDown={() => pickSuggestion(f)}>
                      <span>{f.name}</span>
                      <span style={styles.suggestMeta}>{f.kcal} ккал/100g{f.typicalGrams ? ` · порция ~${f.typicalGrams}г` : ""}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {selectedFood ? (
              <div style={styles.dbRow}>
                <div style={styles.miniField}>
                  <input type="number" value={grams} onChange={e => setGrams(e.target.value)} style={{ ...styles.miniFieldInput, color: "#3fb7a6" }} />
                  <span style={styles.miniFieldLabel}>граммы</span>
                </div>
                <div style={styles.dbPreview}>
                  {computedFromDb && <span style={{ color: "#c2542a", fontWeight: 700 }}>{computedFromDb.kcal} ккал <span style={{ color: "#9a9188", fontWeight: 400 }}>Б{computedFromDb.protein}/Ж{computedFromDb.fat}/У{computedFromDb.carbs}</span></span>}
                </div>
                <button style={styles.addFoodBtn} onClick={addFood}><Plus /></button>
              </div>
            ) : (
              <div style={styles.macroInputRow}>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodKcal} onChange={e => setFoodKcal(e.target.value)} style={{ ...styles.miniFieldInput, color: "#c2542a" }} />
                  <span style={styles.miniFieldLabel}>ккал</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodProtein} onChange={e => setFoodProtein(e.target.value)} style={{ ...styles.miniFieldInput, color: "#3fb7a6" }} />
                  <span style={styles.miniFieldLabel}>белки г</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodFat} onChange={e => setFoodFat(e.target.value)} style={{ ...styles.miniFieldInput, color: "#c2542a" }} />
                  <span style={styles.miniFieldLabel}>жиры г</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodCarbs} onChange={e => setFoodCarbs(e.target.value)} style={{ ...styles.miniFieldInput, color: "#9a9188" }} />
                  <span style={styles.miniFieldLabel}>углев г</span>
                </div>
                <button style={styles.addFoodBtn} onClick={addFood}><Plus /></button>
              </div>
            )}

            {!logLoaded ? <div style={styles.footnote}>Загружаю...</div> : !log.length ? <div style={styles.footnote}>Пока пусто — добавь первый приём пищи выше.</div> : (
              <div style={styles.foodList}>
                {log.map(f => (
                  <div key={f.id} style={styles.foodRow}>
                    <span style={{ flex: 1 }}>{f.name}</span>
                    <span style={styles.foodKcalTag}>{f.kcal} ккал{(f.protein || f.fat || f.carbs) && <span style={styles.macroTag}> Б{f.protein || 0}/Ж{f.fat || 0}/У{f.carbs || 0}</span>}</span>
                    <button style={styles.ghostDelete} onClick={() => removeFood(f.id)}><Trash2 /></button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{ ...styles.card, marginTop: 12 }}>
            <div style={styles.rowLabel}><Droplet /> Вода — сегодня</div>
            <div style={styles.waterQuickRow}>
              {WATER_QUICK.map(q => (
                <button key={q.label} style={styles.waterQuickBtn} onClick={() => addWater(q.ml)}>+ {q.label} ({q.ml} мл)</button>
              ))}
            </div>
            <div style={styles.foodInputRow}>
              <input style={styles.foodKcalInput} placeholder="мл" type="number" value={customMl} onChange={e => setCustomMl(e.target.value)} onKeyDown={e => e.key === "Enter" && addCustomWater()} />
              <button style={styles.addFoodBtn} onClick={addCustomWater}><Plus /></button>
            </div>
            {!waterLoaded ? <div style={styles.footnote}>Загружаю…</div> : !water.length ? <div style={styles.footnote}>Пока пусто — отметь первый стакан воды.</div> : (
              <div style={styles.foodList}>
                {water.map(w => (
                  <div key={w.id} style={styles.foodRow}>
                    <span style={{ flex: 1 }}>💧 вода</span>
                    <span style={styles.foodKcalTag}>{w.ml} мл</span>
                    <button style={styles.ghostDelete} onClick={() => removeWater(w.id)}><Trash2 /></button>
                  </div>
                ))}
              </div>
            )}
            <p style={styles.footnote}>Дневники видны только тебе и сбрасываются на новый день. Расчёты ориентировочные — для точной корректировки подключи консультацию с тренером.</p>
          </div>
        </div>
      );
    }
    // ============================================================
    // STORAGE И ЗАПУСК
    // ============================================================

    window.storage = {
      get: (key, sync) => {
        try {
          const val = localStorage.getItem(key);
          return Promise.resolve(val ? { value: val } : null);
        } catch { return Promise.resolve(null); }
      },
      set: (key, value, sync) => {
        try {
          localStorage.setItem(key, value);
          return Promise.resolve();
        } catch { return Promise.resolve(); }
      }
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<CalorieCalc />);
  </script>
</body>
</html>
