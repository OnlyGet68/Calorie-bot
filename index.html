<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Логово Жизни</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      background: #151312;
      min-height: 100vh;
      width: 100%;
      color: #e9e2d6;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #151312; }
    ::-webkit-scrollbar-thumb { background: #c2542a; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // =============================================================
    // ЗАЩИТА
    // =============================================================
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
    document.addEventListener('keydown', e => {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
    });
    document.addEventListener('selectstart', e => { e.preventDefault(); return false; });
    document.addEventListener('copy', e => { e.preventDefault(); return false; });
    document.addEventListener('dragstart', e => { e.preventDefault(); return false; });

    function detectDevTools() {
      const threshold = 160;
      const widthDiff = window.outerWidth - window.innerWidth;
      const heightDiff = window.outerHeight - window.innerHeight;
      if (widthDiff > threshold || heightDiff > threshold) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#151312;color:#c2542a;font-family:sans-serif;font-size:24px;text-align:center;padding:20px;">🔒 Доступ ограничен<br><span style="font-size:16px;color:#9a9188;">Закройте инструменты разработчика</span></div>';
      }
    }
    setInterval(detectDevTools, 2000);

    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }

    // =============================================================
    // REACT
    // =============================================================
    const { useState, useMemo, useEffect, useCallback } = React;

    // =============================================================
    // TELEGRAM WEBAPP
    // =============================================================
    function useTelegramWebApp() {
      useEffect(() => {
        const tg = window.Telegram?.WebApp;
        if (!tg) return;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => { tg.close(); });
        tg.setHeaderColor('#151312');
        tg.setBackgroundColor('#151312');
        tg.ready();
        return () => { tg.BackButton.hide(); };
      }, []);
    }

    // =============================================================
    // ИКОНКИ
    // =============================================================
    const Flame = () => <span style={{ fontSize: 13 }}>🔥</span>;
    const Plus = () => <span style={{ fontSize: 12, fontWeight: 700 }}>+</span>;
    const Trash2 = () => <span style={{ fontSize: 11 }}>✕</span>;
    const Droplet = () => <span style={{ fontSize: 10 }}>💧</span>;

    // =============================================================
    // ДАННЫЕ
    // =============================================================
    const ACTIVITY = [
      { key: "sedentary", label: "Минимум активности", mult: 1.2 },
      { key: "light", label: "Лёгкая активность", mult: 1.375 },
      { key: "moderate", label: "Средняя активность", mult: 1.55 },
      { key: "high", label: "Высокая активность", mult: 1.725 },
      { key: "extreme", label: "Макс. активность + физ. нагрузки ", mult: 1.9 },
    ];

    const GOALS = [
      { key: "dry", label: "Сушка", delta: -0.25 },
      { key: "lose", label: "Снижение веса", delta: -0.2 },
      { key: "maintain", label: "Удержание веса", delta: 0 },
      { key: "gain", label: "Набор массы", delta: 0.12 },
    ];

    const RECOMMENDATIONS = {
      dry: {
        title: "Сушка",
        note: "Белок, минимум углеводов.",
        items: ["Куриная грудка", "Яичный белок", "Творог 0%", "Тунец", "Креветки", "Брокколи"],
      },
      lose: {
        title: "Снижение веса",
        note: "Баланс белка и клетчатки.",
        items: ["Куриная грудка", "Творог 5%", "Рис", "Овсянка", "Брокколи", "Помидор", "Яблоко"],
      },
      maintain: {
        title: "Удержание",
        note: "Разнообразный рацион.",
        items: ["Куриное бедро", "Лосось", "Яйцо", "Гречка", "Картофель", "Банан"],
      },
      gain: {
        title: "Набор массы",
        note: "Больше калорий, крупы.",
        items: ["Говядина", "Лосось", "Яйцо", "Рис", "Овсянка", "Арахисовая паста"],
      },
    };

    const WATER_QUICK = [
      { label: "Стакан", ml: 250 },
      { label: "0.5л", ml: 500 },
      { label: "1л", ml: 1000 },
      { label: "1.5л", ml: 1500 },
    ];

    const FOOD_DB = [
      { name: "Куриная грудка", kcal: 165, protein: 31, fat: 3.6, carbs: 0 },
      { name: "Куриное бедро", kcal: 209, protein: 18, fat: 15, carbs: 0 },
      { name: "Говядина постная", kcal: 187, protein: 26, fat: 9, carbs: 0 },
      { name: "Лосось", kcal: 208, protein: 20, fat: 13, carbs: 0 },
      { name: "Творог 5%", kcal: 121, protein: 18, fat: 5, carbs: 3 },
      { name: "Творог 0%", kcal: 71, protein: 16, fat: 0.6, carbs: 1.8 },
      { name: "Яйцо целое", kcal: 155, protein: 13, fat: 11, carbs: 1.1 },
      { name: "Гречка варёная", kcal: 92, protein: 3.4, fat: 0.9, carbs: 17.1 },
      { name: "Рис белый варёный", kcal: 130, protein: 2.7, fat: 0.3, carbs: 28 },
      { name: "Овсянка на воде", kcal: 88, protein: 3, fat: 1.7, carbs: 15 },
      { name: "Брокколи", kcal: 34, protein: 2.8, fat: 0.4, carbs: 7 },
      { name: "Помидор", kcal: 18, protein: 0.9, fat: 0.2, carbs: 3.9 },
      { name: "Яблоко", kcal: 52, protein: 0.3, fat: 0.2, carbs: 14 },
      { name: "Банан", kcal: 89, protein: 1.1, fat: 0.3, carbs: 23 },
      { name: "Миндаль", kcal: 579, protein: 21, fat: 50, carbs: 22 },
      { name: "Оливковое масло", kcal: 884, protein: 0, fat: 100, carbs: 0 },
    ];

    const uid = () => Math.random().toString(36).slice(2, 10);
    const dateStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };
    const foodKeyToday = () => `foodlog:${dateStr()}`;
    const waterKeyToday = () => `waterlog:${dateStr()}`;
    const weightKey = "weight_log";

    // =============================================================
    // ГЛАВНЫЙ КОМПОНЕНТ
    // =============================================================
    function CalorieCalc() {
      useTelegramWebApp();

      const [sex, setSex] = useState("male");
      const [age, setAge] = useState(28);
      const [weight, setWeight] = useState(80);
      const [height, setHeight] = useState(178);
      const [activity, setActivity] = useState("light");
      const [goal, setGoal] = useState("lose");

      const [log, setLog] = useState([]);
      const [logLoaded, setLogLoaded] = useState(false);
      const [foodName, setFoodName] = useState("");
      const [foodKcal, setFoodKcal] = useState("");
      const [foodProtein, setFoodProtein] = useState("");
      const [foodFat, setFoodFat] = useState("");
      const [foodCarbs, setFoodCarbs] = useState("");
      const [selectedFood, setSelectedFood] = useState(null);
      const [grams, setGrams] = useState(100);
      const [showSuggestions, setShowSuggestions] = useState(false);

      const [water, setWater] = useState([]);
      const [waterLoaded, setWaterLoaded] = useState(false);
      const [customMl, setCustomMl] = useState("");

      const [weightInput, setWeightInput] = useState("");
      const [weightRecords, setWeightRecords] = useState([]);
      const [weightLoaded, setWeightLoaded] = useState(false);

      const foodKey = foodKeyToday();
      const waterKey = waterKeyToday();

      useEffect(() => {
        (async () => {
          try {
            const r = await window.storage.get(foodKey, false);
            setLog(r ? JSON.parse(r.value) : []);
          } catch { setLog([]); }
          setLogLoaded(true);
          try {
            const r2 = await window.storage.get(waterKey, false);
            setWater(r2 ? JSON.parse(r2.value) : []);
          } catch { setWater([]); }
          setWaterLoaded(true);
          try {
            const r3 = await window.storage.get(weightKey, false);
            setWeightRecords(r3 ? JSON.parse(r3.value) : []);
          } catch { setWeightRecords([]); }
          setWeightLoaded(true);
        })();
      }, []);

      const persistLog = useCallback(async (next) => {
        try { await window.storage.set(foodKey, JSON.stringify(next), false); } catch {}
      }, [foodKey]);

      const persistWater = useCallback(async (next) => {
        try { await window.storage.set(waterKey, JSON.stringify(next), false); } catch {}
      }, [waterKey]);

      const persistWeight = useCallback(async (next) => {
        try { await window.storage.set(weightKey, JSON.stringify(next), false); } catch {}
      }, []);

      function addWeightRecord() {
        const val = Number(weightInput);
        if (!val || val < 20 || val > 300) return;
        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;
        const entry = { id: uid(), date: dateStr, weight: val };
        const next = [...weightRecords, entry];
        setWeightRecords(next);
        persistWeight(next);
        setWeightInput("");
      }

      function removeWeightRecord(id) {
        const next = weightRecords.filter((r) => r.id !== id);
        setWeightRecords(next);
        persistWeight(next);
      }

      const suggestions = useMemo(() => {
        const q = foodName.trim().toLowerCase();
        if (!q || selectedFood) return [];
        return FOOD_DB.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 6);
      }, [foodName, selectedFood]);

      const computedFromDb = useMemo(() => {
        if (!selectedFood) return null;
        const g = Number(grams) || 0;
        const ratio = g / 100;
        return {
          kcal: Math.round(selectedFood.kcal * ratio),
          protein: Math.round(selectedFood.protein * ratio * 10) / 10,
          fat: Math.round(selectedFood.fat * ratio * 10) / 10,
          carbs: Math.round(selectedFood.carbs * ratio * 10) / 10,
        };
      }, [selectedFood, grams]);

      function pickFromRecommendation(name) {
        const dbFood = FOOD_DB.find((f) => f.name === name);
        if (dbFood) {
          setSelectedFood(dbFood);
          setFoodName(dbFood.name);
          setGrams(dbFood.typicalGrams || 100);
          setShowSuggestions(false);
        }
      }

      function addFood() {
        const name = foodName.trim();
        if (!name) return;
        let entry;
        if (selectedFood && computedFromDb) {
          if (!computedFromDb.kcal) return;
          entry = { id: uid(), name: `${name} (${grams} г)`, ...computedFromDb };
        } else {
          const kcal = Number(foodKcal);
          if (!kcal) return;
          entry = {
            id: uid(),
            name,
            kcal,
            protein: Number(foodProtein) || 0,
            fat: Number(foodFat) || 0,
            carbs: Number(foodCarbs) || 0,
          };
        }
        const next = [...log, entry];
        setLog(next);
        persistLog(next);
        setFoodName("");
        setFoodKcal("");
        setFoodProtein("");
        setFoodFat("");
        setFoodCarbs("");
        setSelectedFood(null);
        setGrams(100);
      }

      function removeFood(id) {
        const next = log.filter((f) => f.id !== id);
        setLog(next);
        persistLog(next);
      }

      function addWater(ml) {
        if (!ml) return;
        const next = [...water, { id: uid(), ml }];
        setWater(next);
        persistWater(next);
      }

      function addCustomWater() {
        const ml = Number(customMl);
        if (!ml) return;
        addWater(ml);
        setCustomMl("");
      }

      function removeWater(id) {
        const next = water.filter((w) => w.id !== id);
        setWater(next);
        persistWater(next);
      }

      const result = useMemo(() => {
        const a = Number(age) || 0;
        const w = Number(weight) || 0;
        const h = Number(height) || 0;
        const bmr = sex === "male" ? 10 * w + 6.25 * h - 5 * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
        const mult = ACTIVITY.find((x) => x.key === activity)?.mult ?? 1.2;
        const tdee = bmr * mult;
        const g = GOALS.find((x) => x.key === goal);
        const target = tdee * (1 + g.delta);
        const protein = w * (goal === "dry" ? 2.3 : goal === "lose" ? 2.0 : goal === "gain" ? 1.8 : 1.6);
        const fat = (target * 0.27) / 9;
        const carbs = (target - protein * 4 - fat * 9) / 4;
        const activityIdx = ACTIVITY.findIndex((x) => x.key === activity);
        const waterTarget = w * 33 + Math.max(0, activityIdx - 1) * 350;
        return { bmr, tdee, target, protein, fat, carbs: Math.max(carbs, 0), waterTarget };
      }, [sex, age, weight, height, activity, goal]);

      const eaten = log.reduce((sum, f) => sum + f.kcal, 0);
      const eatenProtein = log.reduce((sum, f) => sum + (f.protein || 0), 0);
      const eatenFat = log.reduce((sum, f) => sum + (f.fat || 0), 0);
      const eatenCarbs = log.reduce((sum, f) => sum + (f.carbs || 0), 0);

      const remaining = Math.round(result.target - eaten);
      const over = remaining < 0;
      const ringPct = Math.min(100, (eaten / (result.target || 1)) * 100);

      const drunk = water.reduce((sum, w) => sum + w.ml, 0);
      const waterRemaining = Math.max(0, Math.round(result.waterTarget - drunk));
      const waterPct = Math.min(100, (drunk / (result.waterTarget || 1)) * 100);
      const waterDone = drunk >= result.waterTarget;

      // =============================================================
      // ГРАФИК ВЕСА
      // =============================================================
      function WeightChart({ records }) {
        if (!records || records.length < 2) {
          return <div style={styles.footnote}>Добавьте 2+ записи для графика</div>;
        }

        const sorted = [...records].sort((a, b) => new Date(a.date.split('.').reverse().join('-')) - new Date(b.date.split('.').reverse().join('-')));
        const weights = sorted.map(r => r.weight);
        const minWeight = Math.min(...weights) - 2;
        const maxWeight = Math.max(...weights) + 2;
        const range = maxWeight - minWeight || 1;

        const width = 220;
        const height = 80;
        const padding = 15;
        const chartWidth = width - padding * 2;
        const chartHeight = height - padding * 2;

        const points = sorted.map((r, i) => {
          const x = padding + (i / (sorted.length - 1 || 1)) * chartWidth;
          const y = padding + chartHeight - ((r.weight - minWeight) / range) * chartHeight;
          return { x, y, weight: r.weight, date: r.date };
        });

        const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
        const last = points[points.length - 1];

        return (
          <div style={{ marginTop: 6, marginBottom: 6 }}>
            <div style={{ fontSize: 8.5, color: "#9a9188", marginBottom: 4 }}>
              📈 График веса (последние {sorted.length} записей)
            </div>
            <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
              <line x1={padding} y1={padding} x2={padding} y2={padding + chartHeight} stroke="#322d29" strokeWidth="0.5" />
              <line x1={padding} y1={padding + chartHeight} x2={padding + chartWidth} y2={padding + chartHeight} stroke="#322d29" strokeWidth="0.5" />
              <text x={padding - 4} y={padding + 4} fontSize="6" fill="#9a9188" textAnchor="end">{maxWeight.toFixed(0)}</text>
              <text x={padding - 4} y={padding + chartHeight + 4} fontSize="6" fill="#9a9188" textAnchor="end">{minWeight.toFixed(0)}</text>
              <polyline points={linePath} fill="none" stroke="#c2542a" strokeWidth="1.5" strokeLinejoin="round" />
              {points.map((p, i) => (
                <circle key={i} cx={p.x} cy={p.y} r={i === points.length - 1 ? 3.5 : 2.5} fill={i === points.length - 1 ? "#c2542a" : "#3fb7a6"} stroke="#151312" strokeWidth="0.8" />
              ))}
              <text x={padding} y={height - 2} fontSize="5" fill="#9a9188" textAnchor="start">{sorted[0].date}</text>
              <text x={padding + chartWidth} y={height - 2} fontSize="5" fill="#9a9188" textAnchor="end">{sorted[sorted.length - 1].date}</text>
              {last && (
                <text x={last.x} y={last.y - 6} fontSize="6" fill="#c2542a" textAnchor="middle" fontWeight="bold">{last.weight} кг</text>
              )}
            </svg>
          </div>
        );
      }

      // =============================================================
      // СТИЛИ
      // =============================================================
      const styles = {
        app: {
          background: "#151312",
          color: "#e9e2d6",
          padding: 8,
          borderRadius: 8,
          border: "1px solid #322d29",
          maxWidth: "100%",
          width: "100%",
          margin: "0 auto",
          boxSizing: "border-box",
          overflowX: "hidden",
        },
        header: { display: "flex", alignItems: "center", gap: 6, marginBottom: 8 },
        brand: { fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 12, letterSpacing: 0.3 },
        sub: { fontSize: 9, color: "#9a9188" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 },
        card: {
          background: "#1c1a18",
          border: "1px solid #322d29",
          borderRadius: 8,
          padding: 10,
          width: "100%",
          boxSizing: "border-box",
          overflow: "hidden",
        },
        rowLabel: { fontSize: 8.5, textTransform: "uppercase", letterSpacing: 0.3, color: "#9a9188", margin: "4px 0 3px" },
        segRow: { display: "flex", gap: 3, flexWrap: "wrap" },
        seg: {
          flex: 1,
          background: "#211e1b",
          border: "1px solid transparent",
          color: "#9a9188",
          borderRadius: 5,
          padding: "6px 4px",
          fontSize: 9.5,
          cursor: "pointer",
          textAlign: "center",
          minWidth: "45px",
          minHeight: "28px",
          lineHeight: 1.2,
        },
        segActive: { background: "#c2542a", color: "#1c1a18", fontWeight: 700 },
        fieldsRow: { display: "flex", gap: 4, margin: "4px 0 2px" },
        field: { flex: 1, display: "flex", flexDirection: "column", gap: 2 },
        fieldLabel: { fontSize: 8, color: "#9a9188" },
        fieldInputWrap: {
          display: "flex",
          alignItems: "center",
          background: "#211e1b",
          border: "1px solid #322d29",
          borderRadius: 5,
          padding: "3px 6px",
        },
        fieldInput: {
          background: "transparent",
          border: "none",
          color: "#3fb7a6",
          width: "100%",
          fontSize: 11,
          fontWeight: 600,
          minWidth: "30px",
        },
        fieldUnit: { fontSize: 8, color: "#9a9188" },
        optRow: { display: "flex", alignItems: "center", gap: 4, background: "#211e1b", border: "1px solid transparent", borderRadius: 5, padding: "4px 6px", cursor: "pointer" },
        optRowActive: { borderColor: "#c2542a", background: "#241d18" },
        optDot: (active) => ({ width: 6, height: 6, borderRadius: "50%", background: active ? "#c2542a" : "#322d29" }),
        optLabel: { fontSize: 9.5, fontWeight: 600 },
        optHint: { fontSize: 8, color: "#9a9188" },
        ringsRow: { display: "flex", justifyContent: "center", gap: 6, padding: "2px 0 4px" },
        ringCol: { display: "flex", flexDirection: "column", alignItems: "center", gap: 1 },
        ringNumber: { fontFamily: "'Oswald', sans-serif", fontSize: 17, fontWeight: 700, fill: "#e9e2d6" },
        ringUnit: { fontSize: 7, fill: "#9a9188" },
        ringCaption: { fontSize: 8, fontWeight: 700 },
        statRow: { display: "flex", gap: 4, marginBottom: 6 },
        statBox: { flex: 1, background: "#211e1b", border: "1px solid #322d29", borderRadius: 5, padding: "4px 6px", textAlign: "center" },
        statValue: { fontFamily: "'Oswald', sans-serif", fontSize: 12, fontWeight: 700, color: "#3fb7a6" },
        statLabel: { fontSize: 8, color: "#9a9188" },
        macroTitle: { fontSize: 8, textTransform: "uppercase", letterSpacing: 0.3, color: "#9a9188", marginBottom: 3 },
        macroRow: { display: "flex", gap: 4 },
        macroBox: { flex: 1, display: "flex", flexDirection: "column", gap: 2 },
        macroBarTrack: { height: 3, borderRadius: 2, background: "#211e1b", overflow: "hidden" },
        macroBarFill: { height: "100%", borderRadius: 2, transition: "width 0.4s ease" },
        macroValue: { fontSize: 9.5, fontWeight: 700 },
        macroLabel: { fontSize: 7.5, color: "#9a9188" },
        foodNameInput: {
          width: "100%",
          background: "#211e1b",
          border: "1px solid #322d29",
          color: "#e9e2d6",
          borderRadius: 5,
          padding: "4px 6px",
          fontSize: 10,
          marginBottom: 3,
          boxSizing: "border-box",
        },
        foodKcalInput: { width: 60, background: "#211e1b", border: "1px solid #322d29", color: "#3fb7a6", borderRadius: 5, padding: "4px 6px", fontSize: 10, textAlign: "center" },
        addFoodBtn: { width: 28, flexShrink: 0, background: "#c2542a", border: "none", borderRadius: 5, color: "#1c1a18", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 12 },
        macroInputRow: { display: "flex", gap: 3, marginBottom: 4, alignItems: "flex-end", flexWrap: "wrap" },
        miniField: { flex: 1, minWidth: 35, display: "flex", flexDirection: "column", gap: 1 },
        miniFieldInput: { background: "#211e1b", border: "1px solid #322d29", borderRadius: 5, padding: "3px 3px", fontSize: 9.5, textAlign: "center", fontWeight: 600, width: "100%" },
        miniFieldLabel: { fontSize: 7, color: "#9a9188", textAlign: "center" },
        foodList: { display: "flex", flexDirection: "column", gap: 3 },
        foodRow: {
          display: "flex",
          alignItems: "center",
          gap: 4,
          background: "#211e1b",
          border: "1px solid #322d29",
          borderRadius: 5,
          padding: "3px 6px",
          fontSize: 9.5,
          width: "100%",
          boxSizing: "border-box",
          overflow: "hidden",
        },
        foodKcalTag: { color: "#3fb7a6", fontWeight: 600, textAlign: "right", flexShrink: 0, fontSize: 9 },
        macroTag: { color: "#9a9188", fontWeight: 400, fontSize: 8 },
        ghostDelete: { background: "transparent", border: "none", color: "#9a9188", cursor: "pointer", fontSize: 11 },
        waterQuickRow: { display: "flex", gap: 3, marginBottom: 4, flexWrap: "wrap" },
        waterQuickBtn: { background: "#211e1b", border: "1px solid #322d29", color: "#3fb7a6", borderRadius: 5, padding: "3px 6px", fontSize: 9, cursor: "pointer", fontWeight: 600 },
        footnote: { fontSize: 8, color: "#9a9188", lineHeight: 1.3, marginTop: 4 },
        foodInputRow: { display: "flex", gap: 3, marginBottom: 4 },
        dbRow: { display: "flex", gap: 4, alignItems: "flex-end", marginBottom: 3 },
        dbPreview: { flex: 1, fontSize: 9.5, paddingBottom: 3 },
        suggestBox: { position: "absolute", top: "100%", left: 0, right: 0, zIndex: 5, marginTop: 2, background: "#211e1b", border: "1px solid #322d29", borderRadius: 5, overflow: "hidden", boxShadow: "0 4px 12px rgba(0,0,0,0.5)" },
        suggestItem: { display: "flex", justifyContent: "space-between", width: "100%", background: "transparent", border: "none", borderBottom: "1px solid #322d29", color: "#e9e2d6", padding: "4px 6px", fontSize: 9.5, cursor: "pointer", textAlign: "left" },
        suggestMeta: { fontSize: 8.5, color: "#9a9188" },
        recoChips: { display: "flex", flexWrap: "wrap", gap: 3, width: "100%" },
        recoChip: {
          background: "#211e1b",
          border: "1px solid #322d29",
          color: "#e9e2d6",
          borderRadius: 999,
          padding: "3px 8px",
          fontSize: 9,
          cursor: "pointer",
          whiteSpace: "nowrap",
          maxWidth: "100%",
          overflow: "hidden",
          textOverflow: "ellipsis",
        },
        weightInputRow: { display: "flex", gap: 4, alignItems: "center", marginBottom: 6 },
        weightInput: {
          flex: 1,
          background: "#211e1b",
          border: "1px solid #322d29",
          color: "#e9e2d6",
          borderRadius: 5,
          padding: "4px 6px",
          fontSize: 10,
          boxSizing: "border-box",
          width: "100%",
        },
        weightAddBtn: {
          background: "#c2542a",
          border: "none",
          borderRadius: 5,
          color: "#1c1a18",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          cursor: "pointer",
          whiteSpace: "nowrap",
          padding: "0 10px",
          height: "28px",
          fontSize: 10,
          fontWeight: 600,
        },
      };

      // =============================================================
      // ВЕРСТКА
      // =============================================================
      return (
        <div style={styles.app}>
          {/* Шапка */}
          <div style={styles.header}>
            <div style={{ width: 24, height: 24, borderRadius: 6, background: "#c2542a", color: "#1c1a18", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Flame />
            </div>
            <div>
              <div style={styles.brand}>ЛОГОВО ЖИЗНИ</div>
              <div style={styles.sub}>норма калорий · еда · вода</div>
            </div>
          </div>

          {/* Основная сетка */}
          <div style={styles.grid}>
            {/* Левая колонка */}
            <div style={styles.card}>
              <div style={styles.rowLabel}>Пол</div>
              <div style={styles.segRow}>
                <button style={{ ...styles.seg, ...(sex === "male" ? styles.segActive : {}) }} onClick={() => setSex("male")}>М</button>
                <button style={{ ...styles.seg, ...(sex === "female" ? styles.segActive : {}) }} onClick={() => setSex("female")}>Ж</button>
              </div>

              <div style={styles.fieldsRow}>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Возраст</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={age} onChange={e => setAge(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>лет</span>
                  </div>
                </div>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Вес</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={weight} onChange={e => setWeight(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>кг</span>
                  </div>
                </div>
                <div style={styles.field}>
                  <span style={styles.fieldLabel}>Рост</span>
                  <div style={styles.fieldInputWrap}>
                    <input type="number" value={height} onChange={e => setHeight(e.target.value)} style={styles.fieldInput} />
                    <span style={styles.fieldUnit}>см</span>
                  </div>
                </div>
              </div>

              <div style={styles.rowLabel}>Активность</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {ACTIVITY.map(a => (
                  <button key={a.key} onClick={() => setActivity(a.key)} style={{ ...styles.optRow, ...(activity === a.key ? styles.optRowActive : {}) }}>
                    <span style={styles.optDot(activity === a.key)} />
                    <span style={{ flex: 1, textAlign: "left" }}>
                      <div style={styles.optLabel}>{a.label}</div>
                    </span>
                  </button>
                ))}
              </div>

              <div style={styles.rowLabel}>Цель</div>
              <div style={styles.segRow}>
                {GOALS.map(g => (
                  <button key={g.key} style={{ ...styles.seg, ...(goal === g.key ? styles.segActive : {}) }} onClick={() => setGoal(g.key)}>
                    {g.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Правая колонка */}
            <div style={styles.card}>
              <div style={styles.ringsRow}>
                <div style={styles.ringCol}>
                  <svg viewBox="0 0 140 140" style={{ width: 90, height: 90 }}>
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#2a2521" strokeWidth="11" />
                    <circle cx="70" cy="70" r="58" fill="none" stroke={over ? "#d9503f" : "#c2542a"} strokeWidth="11" strokeLinecap="round" strokeDasharray={2 * Math.PI * 58} strokeDashoffset={2 * Math.PI * 58 * (1 - ringPct / 100)} transform="rotate(-90 70 70)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
                    <text x="70" y="66" textAnchor="middle" style={styles.ringNumber}>{Math.round(eaten)}</text>
                    <text x="70" y="84" textAnchor="middle" style={styles.ringUnit}>ккал</text>
                  </svg>
                  <div style={{ ...styles.ringCaption, color: over ? "#d9503f" : "#c2542a" }}>
                    {over ? `+${Math.abs(remaining)}` : `${remaining}`}
                  </div>
                </div>

                <div style={styles.ringCol}>
                  <svg viewBox="0 0 140 140" style={{ width: 90, height: 90 }}>
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#2a2521" strokeWidth="11" />
                    <circle cx="70" cy="70" r="58" fill="none" stroke="#3fb7a6" strokeWidth="11" strokeLinecap="round" strokeDasharray={2 * Math.PI * 58} strokeDashoffset={2 * Math.PI * 58 * (1 - waterPct / 100)} transform="rotate(-90 70 70)" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
                    <text x="70" y="66" textAnchor="middle" style={{ ...styles.ringNumber, fill: "#3fb7a6" }}>{(drunk / 1000).toFixed(1)}л</text>
                    <text x="70" y="84" textAnchor="middle" style={styles.ringUnit}>вода</text>
                  </svg>
                  <div style={{ ...styles.ringCaption, color: "#3fb7a6" }}>
                    {waterDone ? "✅" : `${waterRemaining} мл`}
                  </div>
                </div>
              </div>

              <div style={styles.statRow}>
                <div style={styles.statBox}>
                  <div style={styles.statValue}>{Math.round(result.target)}</div>
                  <div style={styles.statLabel}>Норма</div>
                </div>
                <div style={styles.statBox}>
                  <div style={styles.statValue}>{(result.waterTarget / 1000).toFixed(1)} л</div>
                  <div style={styles.statLabel}>Вода</div>
                </div>
              </div>

              <div style={styles.macroTitle}>БЖУ</div>
              <div style={styles.macroRow}>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenProtein / result.protein) * 100)}%`, background: "#3fb7a6" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenProtein)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.protein)}</span></div>
                  <div style={styles.macroLabel}>Б</div>
                </div>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenFat / result.fat) * 100)}%`, background: "#c2542a" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenFat)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.fat)}</span></div>
                  <div style={styles.macroLabel}>Ж</div>
                </div>
                <div style={styles.macroBox}>
                  <div style={styles.macroBarTrack}><div style={{ ...styles.macroBarFill, width: `${Math.min(100, (eatenCarbs / result.carbs) * 100)}%`, background: "#9a9188" }} /></div>
                  <div style={styles.macroValue}>{Math.round(eatenCarbs)} <span style={{ color: "#9a9188", fontWeight: 400 }}>/ {Math.round(result.carbs)}</span></div>
                  <div style={styles.macroLabel}>У</div>
                </div>
              </div>
            </div>
          </div>

          {/* =============================================================
              БЛОК 1: РЕКОМЕНДАЦИИ
              ============================================================= */}
          <div style={{ ...styles.card, marginTop: 6 }}>
            <div style={styles.rowLabel}>{RECOMMENDATIONS[goal].title}</div>
            <p style={{ ...styles.footnote, marginTop: 0, marginBottom: 4 }}>{RECOMMENDATIONS[goal].note}</p>
            <div style={styles.recoChips}>
              {RECOMMENDATIONS[goal].items.map((item) => (
                <button key={item} style={styles.recoChip} onClick={() => pickFromRecommendation(item)}>
                  + {item}
                </button>
              ))}
            </div>
          </div>

          {/* =============================================================
              БЛОК 2: ДНЕВНИК ПИТАНИЯ
              ============================================================= */}
          <div style={{ ...styles.card, marginTop: 6 }}>
            <div style={styles.rowLabel}>Дневник питания</div>
            <div style={{ position: "relative" }}>
              <input
                style={styles.foodNameInput}
                placeholder="введи продукт"
                value={foodName}
                onChange={e => {
                  setFoodName(e.target.value);
                  setShowSuggestions(true);
                  if (selectedFood) setSelectedFood(null);
                }}
                onFocus={() => setShowSuggestions(true)}
                onBlur={() => setTimeout(() => setShowSuggestions(false), 120)}
                onKeyDown={e => e.key === "Enter" && addFood()}
              />
              {showSuggestions && suggestions.length > 0 && (
                <div style={styles.suggestBox}>
                  {suggestions.map(f => (
                    <button
                      key={f.name}
                      style={styles.suggestItem}
                      onMouseDown={() => {
                        setSelectedFood(f);
                        setFoodName(f.name);
                        setGrams(f.typicalGrams || 100);
                        setShowSuggestions(false);
                      }}
                    >
                      <span>{f.name}</span>
                      <span style={styles.suggestMeta}>{f.kcal}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {selectedFood ? (
              <div style={styles.dbRow}>
                <div style={styles.miniField}>
                  <input type="number" value={grams} onChange={e => setGrams(e.target.value)} style={{ ...styles.miniFieldInput, color: "#3fb7a6" }} />
                  <span style={styles.miniFieldLabel}>г</span>
                </div>
                <div style={styles.dbPreview}>
                  {computedFromDb && <span style={{ color: "#c2542a", fontWeight: 700 }}>{computedFromDb.kcal} <span style={{ color: "#9a9188", fontWeight: 400 }}>Б{computedFromDb.protein}/Ж{computedFromDb.fat}/У{computedFromDb.carbs}</span></span>}
                </div>
                <button style={styles.addFoodBtn} onClick={addFood}><Plus /></button>
              </div>
            ) : (
              <div style={styles.macroInputRow}>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodKcal} onChange={e => setFoodKcal(e.target.value)} style={{ ...styles.miniFieldInput, color: "#c2542a" }} />
                  <span style={styles.miniFieldLabel}>ккал</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodProtein} onChange={e => setFoodProtein(e.target.value)} style={{ ...styles.miniFieldInput, color: "#3fb7a6" }} />
                  <span style={styles.miniFieldLabel}>Б</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodFat} onChange={e => setFoodFat(e.target.value)} style={{ ...styles.miniFieldInput, color: "#c2542a" }} />
                  <span style={styles.miniFieldLabel}>Ж</span>
                </div>
                <div style={styles.miniField}>
                  <input type="number" placeholder="0" value={foodCarbs} onChange={e => setFoodCarbs(e.target.value)} style={{ ...styles.miniFieldInput, color: "#9a9188" }} />
                  <span style={styles.miniFieldLabel}>У</span>
                </div>
                <button style={styles.addFoodBtn} onClick={addFood}><Plus /></button>
              </div>
            )}

            {!logLoaded ? (
              <div style={styles.footnote}>Загружаю...</div>
            ) : !log.length ? (
              <div style={styles.footnote}>Пусто</div>
            ) : (
              <div style={styles.foodList}>
                {log.slice(-5).reverse().map(f => (
                  <div key={f.id} style={styles.foodRow}>
                    <span style={{ flex: 1 }}>{f.name}</span>
                    <span style={styles.foodKcalTag}>{f.kcal}</span>
                    <button style={styles.ghostDelete} onClick={() => removeFood(f.id)}><Trash2 /></button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* =============================================================
              БЛОК 3: МЕТОДИКА УПРАВЛЕНИЯ ВЕСОМ (С ГРАФИКОМ)
              ============================================================= */}
          <div style={{ ...styles.card, marginTop: 6 }}>
            <div style={styles.rowLabel}>Методика управления весом</div>
            <div style={styles.weightInputRow}>
              <input
                type="number"
                placeholder="Введите вес (кг)"
                style={styles.weightInput}
                value={weightInput}
                onChange={(e) => setWeightInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addWeightRecord()}
              />
              <button style={styles.weightAddBtn} onClick={addWeightRecord}>+</button>
            </div>
            {!weightLoaded ? (
              <div style={styles.footnote}>Загружаю...</div>
            ) : !weightRecords.length ? (
              <div style={styles.footnote}>Пока нет записей</div>
            ) : (
              <>
                <div style={styles.foodList}>
                  {weightRecords.slice(-5).reverse().map((record) => (
                    <div key={record.id} style={styles.foodRow}>
                      <span style={{ flex: 1 }}>📊 {record.date}</span>
                      <span style={styles.foodKcalTag}>{record.weight} кг</span>
                      <button style={styles.ghostDelete} onClick={() => removeWeightRecord(record.id)}><Trash2 /></button>
                    </div>
                  ))}
                </div>
                {/* ГРАФИК ВЕСА */}
                <WeightChart records={weightRecords} />
              </>
            )}
          </div>

          {/* =============================================================
              БЛОК 4: ВОДА
              ============================================================= */}
          <div style={{ ...styles.card, marginTop: 6 }}>
            <div style={styles.rowLabel}><Droplet /> Вода</div>
            <div style={styles.waterQuickRow}>
              {WATER_QUICK.map(q => (
                <button key={q.label} style={styles.waterQuickBtn} onClick={() => addWater(q.ml)}>+{q.label}</button>
              ))}
            </div>
            <div style={styles.foodInputRow}>
              <input style={styles.foodKcalInput} placeholder="мл" type="number" value={customMl} onChange={e => setCustomMl(e.target.value)} onKeyDown={e => e.key === "Enter" && addCustomWater()} />
              <button style={styles.addFoodBtn} onClick={addCustomWater}><Plus /></button>
            </div>
            {!waterLoaded ? (
              <div style={styles.footnote}>Загружаю…</div>
            ) : !water.length ? (
              <div style={styles.footnote}>Пусто</div>
            ) : (
              <div style={styles.foodList}>
                {water.slice(-5).reverse().map(w => (
                  <div key={w.id} style={styles.foodRow}>
                    <span style={{ flex: 1 }}>💧</span>
                    <span style={styles.foodKcalTag}>{w.ml} мл</span>
                    <button style={styles.ghostDelete} onClick={() => removeWater(w.id)}><Trash2 /></button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =============================================================
    // STORAGE И ЗАПУСК
    // =============================================================
    window.storage = {
      get: (key, sync) => {
        try {
          const val = localStorage.getItem(key);
          return Promise.resolve(val ? { value: val } : null);
        } catch { return Promise.resolve(null); }
      },
      set: (key, value, sync) => {
        try {
          localStorage.setItem(key, value);
          return Promise.resolve();
        } catch { return Promise.resolve(); }
      }
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<CalorieCalc />);
  </script>
</body>
</html>
